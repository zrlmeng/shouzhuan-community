services:
  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe_Install}
      MYSQL_DATABASE: ${MYSQL_DB:-ztdh-app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 8s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:-eclipse-temurin:25-jre}
    container_name: ${APP_NAME}-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /yudao-server
    volumes:
      - ./app/yudao-server.jar:/yudao-server/app.jar:ro
      - ./data/upload:/data/upload
      - ./data/files:/data/files
    environment:
      SERVER_PORT: "48080"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1280m -Djava.security.egd=file:/dev/./urandom}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DB:-ztdh-app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe_Install}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://mysql:3306/${MYSQL_DB:-ztdh-app}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_PASSWORD:-ChangeMe_Install}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_DATABASE: "${REDIS_DB:-2}"
      YUDAO_LICENSE_RUNTIME_EDITION: ${YUDAO_LICENSE_RUNTIME_EDITION:-install}
      YUDAO_LICENSE_RUNTIME_ONLINE_REQUIRED: ${YUDAO_LICENSE_RUNTIME_ONLINE_REQUIRED:-true}
      YUDAO_LICENSE_RUNTIME_OFFLINE_GRACE_HOURS: ${YUDAO_LICENSE_RUNTIME_OFFLINE_GRACE_HOURS:-0}
      YUDAO_INSTALL_WEB_ENABLED: ${YUDAO_INSTALL_WEB_ENABLED:-true}
      YUDAO_INSTALL_LOCK_PATH: /data/upload/install.lock
      YUDAO_FRAMEWORK_VERSION: ${YUDAO_FRAMEWORK_VERSION:-1.0.0}
      YUDAO_CAPTCHA_ENABLE: "false"
    command: ["sh", "-c", "java $$JAVA_OPTS -jar /yudao-server/app.jar"]
    ports:
      - "${APP_PORT:-8080}:48080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:48080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
